<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Demo's</title>
<style>
  :root{--bg:#0b0f14;--panel:#121821;--border:#2a3548;--text:#e8eef7;--muted:#8b9bb4;--accent:#4d9fff;
    --sans:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
  body{padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 16px)}
  h1{font-size:24px;margin:0 0 4px}
  p.lead{color:var(--muted);margin:0 0 14px;font-size:15px;line-height:1.4}
  .tools{display:grid;gap:8px;margin-bottom:6px}
  .tools input,.tools select{width:100%;min-height:44px;font-size:16px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
  .row{display:flex;gap:8px;align-items:center}
  .row select{flex:1}
  .count{font-size:13px;color:var(--muted);white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:14px}
  .chip[aria-pressed="true"]{background:#1d2a3d;border-color:var(--accent);color:var(--text)}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  li{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}
  .pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .pill{font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:999px;color:var(--muted)}
  .f-Werkt{color:#3dd68c;border-color:#1f6b47}.f-Proef{color:#f0b429;border-color:#6b5317}.f-Ontwerp{color:#c084fc;border-color:#5b3b7a}
  h2{font-size:18px;margin:0 0 6px}
  li p{margin:0 0 12px;font-size:15px;line-height:1.4;color:#cfd8e6}
  .links{display:flex;gap:8px}
  .links a{flex:1;min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:10px;
    text-decoration:none;font-weight:600;font-size:16px;border:1px solid var(--border);color:var(--text)}
  .links a.run{background:var(--accent);border-color:var(--accent);color:#fff}
  .next{font-size:12px;color:var(--muted);margin:10px 0 0}
  h2.sec{font-size:15px;margin:20px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .empty{color:var(--muted);font-size:15px;margin:16px 0}
  footer{margin-top:20px;font-size:13px;color:var(--muted);line-height:1.4}
  footer a{color:var(--muted)}
</style>
</head>
<body>
  <h1>Demo's</h1>
  <p class="lead">Onze bouwsels om te bekijken en uit te proberen in Safari. Geen app, geen account. Alles leest alleen openbare gegevens: niets wordt ondertekend of verstuurd.</p>
  <div class="tools">
    <input id="q" type="search" placeholder="Zoek op naam, uitleg of tag" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="row">
      <select id="sort" aria-label="Sorteren">
        <option value="datum">Laatst bijgewerkt</option>
        <option value="naam">Naam</option>
        <option value="fase">Fase</option>
      </select>
      <span class="count" id="count"></span>
    </div>
  </div>
  <div id="list"></div>
  <footer>Broncode: <a href="https://github.com/NRCHST/ba-demos">github.com/NRCHST/ba-demos</a></footer>
<script>
// Demo's: hier bijwerken. sectie = kop op de pagina; fase: Ontwerp | Proef | Werkt
var DEMOS=[
  {map:"bitmap-lab", naam:"Bitmap Lab", sectie:"Bitcoin", tags:["Bitcoin","Bitmap","Ordinals"], fase:"Werkt", bijgewerkt:"2026-09-28", volgende:"nog niet bepaald",
   uitleg:"Kies een bloknummer en zie het als een “wijk”: elke transactie in dat blok is een “perceel”."},
  {map:"bitmap-wereld", naam:"Bitmap Wereld", sectie:"Bitcoin", tags:["Bitcoin","Bitmap","Ordinals","3D"], fase:"Werkt", bijgewerkt:"2026-10-16", volgende:"nog niet bepaald",
   uitleg:"De openbare patroongalerijen (999 club, punks) als 3D-wijk. Tik een blok voor zijn inscription-ID."},
  {map:"bitmap-tool", naam:"Gratis bitmap-tool", sectie:"Bitcoin", tags:["Bitcoin","Bitmap","Ordinals","3D"], fase:"Proef", bijgewerkt:"2026-10-16", volgende:"adres-opzoeking testen",
   uitleg:"Plak bloknummers of een adres en zie die bitmaps in 3D met patroontags. Alleen lezen, geen wallet koppelen."},
  {map:"bulletin-ontwerp", naam:"Bulletin-ontwerp bitmap.land", sectie:"Bitcoin", tags:["Bitcoin","Bitmap"], fase:"Ontwerp", bijgewerkt:"2026-10-16", volgende:"schema van bitmap.land zoeken",
   uitleg:"Alleen een ontwerp van een bulletin. Niets wordt ingeschreven of gepost."}
];
var SECTIES=["Bitcoin"]; // volgorde van de koppen
(function(){
  var M=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"],FASES=["Werkt","Proef","Ontwerp"];
  var $=function(id){return document.getElementById(id)},sel=new Set();
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function dag(d){var p=d.split("-");return (+p[2])+" "+M[p[1]-1]}
  var topics=[];DEMOS.forEach(function(d){d.tags.forEach(function(t){if(topics.indexOf(t)<0)topics.push(t)})});
  var chips=["Alles"].concat(topics,FASES);
  $("chips").innerHTML=chips.map(function(c){return '<button type="button" class="chip" data-c="'+esc(c)+'" aria-pressed="'+(c==="Alles")+'">'+esc(c)+'</button>'}).join("");
  $("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;var c=b.dataset.c;
    if(c==="Alles")sel.clear();else if(sel.has(c))sel.delete(c);else sel.add(c);render()};
  function card(d){return '<li><div class="pills">'+d.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>'}).join("")+
    '<span class="pill f-'+d.fase+'">'+d.fase+'</span><span class="pill">Bijgewerkt '+dag(d.bijgewerkt)+'</span></div>'+
    '<h2>'+esc(d.naam)+'</h2><p>'+esc(d.uitleg)+'</p><div class="links"><a class="run" href="'+d.map+'/#run">Run</a><a href="'+d.map+'/#code">Code</a></div>'+
    '<p class="next">Volgende stap: '+esc(d.volgende)+'</p></li>'}
  function render(){
    document.querySelectorAll(".chip").forEach(function(b){var c=b.dataset.c;b.setAttribute("aria-pressed",String(c==="Alles"?sel.size===0:sel.has(c)))});
    var q=$("q").value.trim().toLowerCase(),st=[...sel].filter(function(c){return topics.indexOf(c)>=0}),sf=[...sel].filter(function(c){return FASES.indexOf(c)>=0});
    var r=DEMOS.filter(function(d){return (!q||(d.naam+" "+d.uitleg+" "+d.tags.join(" ")).toLowerCase().indexOf(q)>=0)&&
      st.every(function(t){return d.tags.indexOf(t)>=0})&&(!sf.length||sf.indexOf(d.fase)>=0)});
    var s=$("sort").value;
    r.sort(s==="naam"?function(a,b){return a.naam.localeCompare(b.naam,"nl")}:s==="fase"?function(a,b){return FASES.indexOf(a.fase)-FASES.indexOf(b.fase)||a.naam.localeCompare(b.naam,"nl")}:function(a,b){return b.bijgewerkt.localeCompare(a.bijgewerkt)||a.naam.localeCompare(b.naam,"nl")});
    $("count").textContent=r.length+(r.length===1?" demo":" demo's");
    var h;
    if(!r.length)h='<p class="empty">Geen demo gevonden.</p>';
    else if(!q&&!sel.size&&s==="datum")h=SECTIES.map(function(x){var g=r.filter(function(d){return d.sectie===x});return g.length?'<section><h2 class="sec">'+esc(x)+'</h2><ul>'+g.map(card).join("")+'</ul></section>':""}).join("");
    else h='<ul style="margin-top:12px">'+r.map(card).join("")+'</ul>';
    $("list").innerHTML=h;
  }
  $("q").oninput=render;$("sort").onchange=render;render();
})();
</script>
</body>
</html>
